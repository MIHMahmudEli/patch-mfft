services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MODEL_VARIANT=base
      - WORKERS=1
    volumes:
      - ./model/checkpoints:/app/model/checkpoints
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped
